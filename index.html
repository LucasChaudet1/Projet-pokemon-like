<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Quest</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ÉCRAN D'ACCUEIL -->
    <div id="startScreen" class="screen">

        <h1>MONSTER QUEST</h1>

        <p>Bienvenue dans ton aventure !</p>

        <input
            type="text"
            id="pseudoInput"
            placeholder="Entre ton pseudo"
            maxlength="15"
        >

        <input
            type="password"
            id="passwordInput"
            placeholder="Mot de passe"
            maxlength="72"
            class="hidden"
        >

        <p id="authError" class="auth-error"></p>

        <button id="startButton">
            COMMENCER
        </button>

        <div id="authButtons" class="auth-buttons hidden">
            <button id="loginButton">Se connecter</button>
            <button id="registerButton">Créer un compte</button>
        </div>

    </div>


    <!-- ÉCRAN DE SÉLECTION DE CRÉATURE -->
    <div id="creatureScreen" class="screen hidden">

        <h1>Choisissez votre créature de départ !</h1>
        <p>Quelle créature veux-tu comme compagnon ?</p>

        <div id="creatureSelection" class="creature-selection">
            <!-- Les créatures seront générées par JavaScript -->
        </div>

    </div>


    <!-- ÉCRAN DU JEU -->
    <div id="gameScreen" class="screen hidden">

        <!-- PSEUDO ET CRÉATURE EN HAUT -->
        <div class="top-bar">
            <div id="playerName"></div>

            <div id="moneyDisplay" class="money-display"></div>

            <button id="pokedexButton" class="pokedex-button">📖 Pokédex</button>
            <button id="pvpButton" class="pokedex-button pvp-button">⚔️ PvP</button>
            <button id="tradeButton" class="pokedex-button trade-button">🔁 Échange</button>
            <button id="logoutButton" class="pokedex-button logout-button hidden">🔓 Déconnexion</button>

            <div id="teamDisplay" class="team-display">
                <!-- Équipe générée en JavaScript -->
            </div>
        </div>

        <div id="zoneLabel" class="zone-label"></div>

        <div class="map-container">
            <canvas id="gameCanvas" width="640" height="480"></canvas>
        </div>

        <p class="controls-hint">Déplace-toi avec les flèches directionnelles ou ZQSD</p>
        <p class="controls-hint">Interagis avec les objets et les personnages en pressant la touche E</p>

    </div>


    <!-- Client Supabase (nécessaire pour le compte joueur, le combat PvP et l'échange en ligne) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="supabase-config.js"></script>

    <script src="game.js"></script>
</body>
</html>
